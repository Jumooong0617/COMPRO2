<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Edit Student</title>
</head>
<body>
<h1>Edit Student</h1>
<form action="/update" method="post">
    <input type="hidden" name="id" th:value="${coffee.id}">
    <label>Coffee Name</label>: <input type="text" name="firstName" th:value="${coffee.name}" required></label><br>
    <label>Type: <input type="text" name="lastName" th:value="${coffee.type}" required></label><br>
    <button type="submit">Update</button>
</form>
<a href="/">Back to List</a>
</body>
</html>
